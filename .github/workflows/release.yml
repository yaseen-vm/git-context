name: Release

on:
  release:
    types: [published]

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            asset_name: git-context-linux-x64
          - os: macos-latest
            target: macos-x64
            asset_name: git-context-macos-x64
          - os: macos-latest
            target: macos-arm64
            asset_name: git-context-macos-arm64
          - os: windows-latest
            target: win-x64
            asset_name: git-context-win-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle to CJS
        run: npm run build:bundle

      - name: Build binary (${{ matrix.target }})
        run: npx pkg dist-bundle/cli.cjs --target node20-${{ matrix.target }} --output binaries/${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
